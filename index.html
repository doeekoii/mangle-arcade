<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멩글아케이드 부스 미니홈피</title>
<meta name="description" content="제주대학교 멩글아케이드 — 부스 QR을 찍고 팀 소개를 보고, 방명록과 명함을 남겨 주세요.">
<meta property="og:title" content="멩글아케이드 부스 미니홈피">
<meta property="og:description" content="부스 QR을 찍고 팀 소개를 보고, 방명록과 명함을 남겨 주세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261127d">
</head>
<body>
<div class="wrap top"><a class="logo" href="#"><i>MA</i><span><b>MANGLE ARCADE</b><small>멩글아케이드 부스 미니홈피</small></span></a><a href="#">전체 부스 보기</a></div>
<div class="wrap banner" id="banner" hidden><p id="bannerText"></p></div>
<main id="app" class="wrap"><p class="note">불러오는 중…</p></main>
<div class="qrsheet" id="qrsheet"></div>

<dialog id="pinDlg" tabindex="-1">
  <form id="pinForm" method="dialog">
    <div><h3 id="pinTitle">팀 로그인</h3><p class="note" id="pinHint">운영사에서 받은 팀 PIN을 입력해 주세요.</p></div>
    <input class="pin" id="pinInput" type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="PIN" required>
    <p class="err" id="pinErr" role="alert"></p>
    <div class="row"><button class="btn" id="pinOk" value="ok">확인</button><button class="btn ghost" type="button" id="pinCancel">취소</button></div>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox" aria-label="사진 크게 보기" tabindex="-1">
  <div class="lbstage"><img id="lbImg" alt=""><div class="lblike" id="lbLike"></div><svg id="lbHeart" class="burst" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.5-9.6-9.1C1 8.1 3.1 4.6 6.6 4.6c2.1 0 3.6 1.2 5.4 3.1 1.8-1.9 3.3-3.1 5.4-3.1 3.5 0 5.6 3.5 4.2 6.8-2 4.6-9.6 9.1-9.6 9.1z"/></svg></div>
  <div class="lbbar"><div id="lbCap" class="lbcap"></div><div class="row"><button class="btn ghost small" id="lbPrev" aria-label="이전 사진">←</button><button class="btn ghost small" id="lbNext" aria-label="다음 사진">→</button><button class="btn small" id="lbClose">닫기</button></div></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module" src="app.js?v=20261127d"></script>
</body>
</html>
